# ============================================================================
# ThriveX-Admin CD 工作流（Docker 部署）
# ----------------------------------------------------------------------------
# 持续部署：Docker 镜像构建 + 推送至镜像仓库 + SSH 远程部署
# 仅在 main 分支推送（合并 PR 后）或打 tag 时触发。
# ============================================================================

name: Deploy

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 部署目标
        required: true
        default: docker
        type: choice
        options:
          - docker
          - vercel
          - both

env:
  NODE_VERSION: '22'
  IMAGE_NAME: thrivex-admin

jobs:
  # ==========================================================================
  # Job 1: 构建并推送 Docker 镜像
  # ==========================================================================
  docker-build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    # 仅在 main 分支或 tag 推送时执行（手动触发也执行）
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # 设置 Docker Buildx（支持多阶段构建与缓存）
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GitHub Container Registry（公开仓库免费）
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 可选：登录 Docker Hub（如需推送至 Docker Hub，取消注释并配置 Secrets）
      # - name: 登录 Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 自动生成镜像标签（latest / 分支名 / tag / commit SHA）
      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/thrivex-admin
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # 构建并推送镜像（传入 API 地址作为构建参数）
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_PROJECT_API=${{ secrets.VITE_PROJECT_API || 'https://api.example.com/api' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Job 2: SSH 远程部署（拉取新镜像并重启容器）
  # ==========================================================================
  ssh-deploy:
    name: SSH 远程部署
    runs-on: ubuntu-latest
    needs: docker-build
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) &&
      vars.DEPLOY_HOST != ''
    # 需要配置 Repository Variables 或 Secrets：
    #   DEPLOY_HOST       — 服务器 IP 或域名
    #   DEPLOY_PORT       — SSH 端口（默认 22，可用 Variable）
    #   DEPLOY_USER       — SSH 用户名
    #   DEPLOY_SSH_KEY    — SSH 私钥（Secret）
    #   DEPLOY_PATH       — 服务器上存放 docker-compose 的目录

    steps:
      - name: 通过 SSH 拉取镜像并重启容器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH }}
            # 登录 GHCR 拉取私有镜像（公开镜像可省略）
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # 拉取最新镜像
            docker pull ghcr.io/${{ github.repository_owner }}/thrivex-admin:latest
            # 使用 docker compose 重启服务（若使用 docker run 请自行调整）
            docker compose down || true
            docker compose up -d
            # 清理旧镜像
            docker image prune -f
            echo "✅ 部署完成: $(date '+%Y-%m-%d %H:%M:%S')"

  # ==========================================================================
  # Job 3: Vercel 部署（可选）
  # ==========================================================================
  vercel-deploy:
    name: Vercel 部署
    runs-on: ubuntu-latest
    needs: []
    if: |
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.deploy_target == 'vercel' || github.event.inputs.deploy_target == 'both')
    # 需要配置 Secrets：
    #   VERCEL_TOKEN      — Vercel 访问令牌
    #   VERCEL_ORG_ID     — Vercel 团队/组织 ID
    #   VERCEL_PROJECT_ID — Vercel 项目 ID

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 Vercel CLI
        run: npm install -g vercel@latest

      - name: 拉取 Vercel 环境配置
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 构建项目
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_PROJECT_API: ${{ secrets.VITE_PROJECT_API || 'https://api.example.com/api' }}

      - name: 部署到 Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
